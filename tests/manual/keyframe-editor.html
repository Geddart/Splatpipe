<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splatpipe SceneView harness — keyframe editor (Tasks 0, 6-14)</title>
  <!--
    SHARED Playwright harness for the camera-keyframe-editor plan
    (Tasks 0 and 6-14). Same in-viewer-verification style as the other
    tests/manual/*.html pages: a host page that embeds the generated Spark
    viewer in <iframe>s and runs assertions against each iframe's live
    `window` — but here it is automated, not eyeballed.

    The viewer under test is generated by:
      python -m splatpipe.viewers.spark._gen_harness_viewer   (see HOW TO RUN)
    into  tests/manual/_viewer/index.html  (+ a stub viewer-config.json),
    and this whole `tests/manual/` directory is served over HTTP with Range
    support (Spark needs Range; see `splatpipe serve`). The framework objects
    under test (`window.__sceneview`) are constructed during module init —
    BEFORE the async scene.rad load — so the assertions do NOT need a real
    .rad or any network; a 404 on scene.rad is expected and irrelevant here.

    ───────────────────────── HOW TO RUN ─────────────────────────
      # 1. (re)generate the viewer-under-test:
      python -m splatpipe.viewers.spark._gen_harness_viewer
      # 2. serve tests/manual/ with Range support on :8777
      python -m splatpipe.viewers.spark._gen_harness_viewer --serve 8777
      # 3. drive with the Playwright MCP browser:
      #    navigate http://localhost:8777/keyframe-editor.html
      #    wait for window.__harness.done === true
      #    assert  window.__harness.ok === true
      #            (window.__harness.results lists every check + pass/fail)
    The page also renders the same report visually for a human.

    Task 0 contract asserted here:
      • each iframe's window.__sceneview exposes:
          .mode  (string: 'user'|'author'|'embed')
          .overlay.register(layer) / .overlay.unregister(layer)
          .interaction.requestPointer(owner) / .interaction.releasePointer(owner)
          .hud.register(panel)
      • default URL              -> mode === 'user'
      • ?author=1                -> mode === 'author'
      • ?embed=1                 -> mode === 'embed'
      • a probe overlay layer registered with modes:['author'] is
        attached/visible in the author iframe and NOT visible in the
        user iframe (one show/hide registry, keyed by mode)
      • ?embed=1 hides all Splatpipe chrome (#header/#stats/#controls-hint/
        #path-hud/#sp-hud computed display:none) — the existing embed
        behavior, now owned by ModeManager.
  -->
  <style>
    html, body { height: 100%; margin: 0; padding: 0;
                 background: #0d0d0d; color: #ddd;
                 font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    body { display: flex; flex-direction: column; }
    #report {
      flex: 0 0 auto; padding: 12px 16px; font: 13px/1.5 ui-monospace, monospace;
      background: #141414; border-bottom: 1px solid #2a2a2a; white-space: pre-wrap;
      max-height: 46vh; overflow: auto;
    }
    #report .ok   { color: #5ad36b; }
    #report .fail { color: #ff5a5a; }
    #report .head { color: #fff; font-weight: 700; }
    #report .note { color: #8a8a8a; }
    .frames { flex: 1; display: flex; min-height: 0; }
    .frames .pane { flex: 1; display: flex; flex-direction: column; min-height: 0;
                    border-right: 1px solid #2a2a2a; }
    .frames .pane:last-child { border-right: 0; }
    .frames .lbl { flex: 0 0 auto; padding: 6px 10px; font-size: 12px;
                   background: #1a1a1a; border-bottom: 1px solid #2a2a2a; color: #aaa; }
    .frames iframe { flex: 1; width: 100%; border: 0; background: #000; }
  </style>
</head>
<body>
  <div id="report">SceneView harness — loading viewer iframes…</div>
  <div class="frames">
    <div class="pane">
      <div class="lbl">default (expect mode=user)</div>
      <iframe id="f-user" src="./_viewer/index.html" title="user mode"></iframe>
    </div>
    <div class="pane">
      <div class="lbl">?author=1 (expect mode=author)</div>
      <iframe id="f-author" src="./_viewer/index.html?author=1" title="author mode"></iframe>
    </div>
    <div class="pane">
      <div class="lbl">?embed=1 (expect mode=embed, chrome hidden)</div>
      <iframe id="f-embed" src="./_viewer/index.html?embed=1" title="embed mode"></iframe>
    </div>
  </div>

  <script>
  // Plain script (no modules) so it runs even if the viewer's importmap CDN
  // is unreachable in CI — we only ever touch each iframe's `window`.
  (function () {
    const results = [];
    const T = (name, cond, detail) => {
      results.push({ name: name, pass: !!cond, detail: detail || '' });
    };

    function frameWin(id) {
      const f = document.getElementById(id);
      return f && f.contentWindow ? f.contentWindow : null;
    }

    // The framework is built during the viewer module's synchronous init.
    // It runs after `import`s resolve, so poll for `__sceneview` with a
    // generous cap (CDN three/spark can take a few seconds first hit).
    // We also wait for `window.__sp` (the viewer's existing debug surface,
    // set a little later than __sceneview) so the probe-layer assertion
    // can use a REAL THREE.Object3D node — independent of the viewer's
    // __sceneview-vs-__sp init ordering. This is harness robustness; it
    // does not relax what the framework must provide.
    function waitForSceneView(win, capMs) {
      return new Promise((resolve) => {
        const t0 = Date.now();
        (function poll() {
          let sv, sp;
          try { sv = win && win.__sceneview; sp = win && win.__sp; }
          catch (e) { sv = undefined; sp = undefined; }
          if (sv && sp && sp.THREE) return resolve(sv);
          if (Date.now() - t0 > capMs) return resolve(sv || undefined);
          setTimeout(poll, 100);
        })();
      });
    }

    function isHidden(win, sel) {
      try {
        const el = win.document.querySelector(sel);
        if (!el) return true; // absent counts as not-visible
        const cs = win.getComputedStyle(el);
        return cs.display === 'none' || cs.visibility === 'hidden';
      } catch (e) { return false; }
    }

    async function run() {
      const userWin = frameWin('f-user');
      const authorWin = frameWin('f-author');
      const embedWin = frameWin('f-embed');

      // Poll the three frames in PARALLEL so the worst case is ~one cap
      // window, not 3× (CDN three/spark first-hit can be slow).
      const [svUser, svAuthor, svEmbed] = await Promise.all([
        waitForSceneView(userWin, 30000),
        waitForSceneView(authorWin, 30000),
        waitForSceneView(embedWin, 30000),
      ]);

      // ── Surface shape (the FOUNDATION contract) ──────────────────────
      T('user: window.__sceneview exists', !!svUser);
      T('author: window.__sceneview exists', !!svAuthor);
      T('embed: window.__sceneview exists', !!svEmbed);

      const shapeOk = (sv) => sv &&
        typeof sv.mode === 'string' &&
        sv.overlay && typeof sv.overlay.register === 'function' &&
        typeof sv.overlay.unregister === 'function' &&
        sv.interaction && typeof sv.interaction.requestPointer === 'function' &&
        typeof sv.interaction.releasePointer === 'function' &&
        sv.hud && typeof sv.hud.register === 'function';

      T('user: __sceneview exposes mode/overlay/interaction/hud', shapeOk(svUser));
      T('author: __sceneview exposes mode/overlay/interaction/hud', shapeOk(svAuthor));
      T('embed: __sceneview exposes mode/overlay/interaction/hud', shapeOk(svEmbed));

      // ── Mode resolution from URL ─────────────────────────────────────
      T('default URL -> mode === "user"', svUser && svUser.mode === 'user',
        svUser ? 'got: ' + svUser.mode : 'no __sceneview');
      T('?author=1 -> mode === "author"', svAuthor && svAuthor.mode === 'author',
        svAuthor ? 'got: ' + svAuthor.mode : 'no __sceneview');
      T('?embed=1 -> mode === "embed"', svEmbed && svEmbed.mode === 'embed',
        svEmbed ? 'got: ' + svEmbed.mode : 'no __sceneview');

      // ── OverlayScene: one show/hide registry keyed by mode ───────────
      // Register a probe layer that declares modes:['author']. It must be
      // visible in the author iframe and NOT visible in the user iframe,
      // proving the single mode-keyed show/hide registry works.
      function probeVisible(sv, win) {
        if (!sv || !sv.overlay || !win) return null;
        const THREE = win.__sp && win.__sp.THREE;
        if (!THREE) return 'no-THREE';   // explicit, not a misleading null
        try {
          const node = new THREE.Object3D();
          const layer = { id: 'probe', modes: ['author'], node: node,
                          update: function () {} };
          sv.overlay.register(layer);
          // "visible" == attached to the overlay group AND its mode
          // matches (the single mode-keyed show/hide registry).
          const attached = !!(node.parent);
          const vis = attached && node.visible !== false;
          sv.overlay.unregister(layer);
          return vis;
        } catch (e) { return 'err:' + e; }
      }
      const probeInAuthor = probeVisible(svAuthor, authorWin);
      const probeInUser = probeVisible(svUser, userWin);
      T('probe overlay layer (modes:[author]) visible in author mode',
        probeInAuthor === true,
        'got: ' + probeInAuthor);
      T('probe overlay layer (modes:[author]) hidden in user mode',
        probeInUser === false,
        'got: ' + probeInUser);

      // ── InteractionManager: pointer arbitration is queryable ─────────
      function pointerArb(sv) {
        if (!sv || !sv.interaction) return null;
        try {
          const im = sv.interaction;
          const g1 = im.requestPointer('probeOwner');     // acquire
          const owner = typeof im.currentOwner === 'function'
            ? im.currentOwner() : undefined;
          im.releasePointer('probeOwner');                 // release
          return { granted: g1 !== false, owner: owner };
        } catch (e) { return null; }
      }
      const pa = pointerArb(svUser);
      T('interaction.requestPointer/releasePointer works + currentOwner reflects it',
        pa && pa.granted === true && pa.owner === 'probeOwner',
        'got: ' + JSON.stringify(pa));

      // ── HudLayer: panels register without throwing ───────────────────
      function hudReg(sv, win) {
        if (!sv || !sv.hud || !win) return null;
        try {
          const el = win.document.createElement('div');
          el.id = '__probe_hud_panel';
          const panel = { id: 'probePanel', el: el, modes: ['author'] };
          sv.hud.register(panel);
          return true;
        } catch (e) { return false; }
      }
      T('hud.register(panel) accepts a panel without throwing',
        hudReg(svUser, userWin) === true);

      // ── ?embed=1 hides ALL Splatpipe chrome (existing behavior) ──────
      const chromeSel = ['#header', '#stats', '#controls-hint',
                         '#path-hud', '#sp-hud'];
      if (embedWin) {
        let allHidden = true, shown = [];
        for (const s of chromeSel) {
          if (!isHidden(embedWin, s)) { allHidden = false; shown.push(s); }
        }
        T('?embed=1 hides all chrome (#header/#stats/#controls-hint/#path-hud/#sp-hud)',
          allHidden, shown.length ? 'still shown: ' + shown.join(',') : '');
      } else {
        T('?embed=1 hides all chrome (#header/#stats/#controls-hint/#path-hud/#sp-hud)',
          false, 'no embed iframe window');
      }
      // And in user mode the header IS visible (regression guard: mode-class
      // gating must not hide chrome outside embed).
      if (userWin) {
        T('user mode keeps #header visible (no over-hiding)',
          !isHidden(userWin, '#header'));
      }

      // ── Report ───────────────────────────────────────────────────────
      const passCount = results.filter(r => r.pass).length;
      const ok = passCount === results.length;
      const lines = [];
      lines.push('<span class="head">SceneView harness — ' +
        passCount + '/' + results.length +
        (ok ? ' <span class="ok">ALL PASS</span>'
            : ' <span class="fail">FAIL</span>') + '</span>');
      for (const r of results) {
        lines.push((r.pass ? '<span class="ok">  PASS</span>'
                           : '<span class="fail">  FAIL</span>') +
          '  ' + r.name +
          (r.detail ? '   <span class="note">(' + r.detail + ')</span>' : ''));
      }
      lines.push('<span class="note">\nThis page is automated by the Playwright MCP browser. ' +
        'Read window.__harness.ok / .results.</span>');
      document.getElementById('report').innerHTML = lines.join('\n');

      window.__harness = { done: true, ok: ok, results: results };
    }

    // Kick off once the DOM (iframes) exist. Guarded so it runs exactly
    // once whether `DOMContentLoaded` already fired or not — host-load
    // timing must never stall the harness.
    window.__harness = { done: false, ok: false, results: [] };
    let _started = false;
    const _go = () => { if (_started) return; _started = true; run(); };
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', _go);
    } else {
      _go();
    }
  })();
  </script>
</body>
</html>
