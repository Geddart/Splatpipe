name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history required: negative-control tests in
          # test_html_for_save_mode.py fetch historical blobs via
          # `git cat-file blob <sha>:path` to prove discriminators.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev,web]"

      - name: Lint with ruff
        run: ruff check src/ tests/ tools/

      - name: Run tests
        run: pytest tests/ -v
